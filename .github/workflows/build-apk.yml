name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & build web bundle
        run: |
          npm install --legacy-peer-deps
          npm run build
          rm -f dist/*.zip
          find dist/assets/aistudio -type f ! -name 'peta_wilayah_1066_3c98484c.png' -delete 2>/dev/null || true

      - name: Setup Capacitor Android
        run: |
          npm install --legacy-peer-deps --no-save @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply Custom APK Launcher Icon
        run: |
          ICON_SRC="assets/icon.png"
          if [ ! -f "$ICON_SRC" ]; then
            ICON_SRC="public/pwa-512x512.png"
          fi
          if [ -f "$ICON_SRC" ]; then
            if ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            fi
            RES_DIR="android/app/src/main/res"
            set_icon() {
              dir="$RES_DIR/$1"
              sz="$2"
              fg="$3"
              art=$((fg * 72 / 100))
              mkdir -p "$dir"
              convert "$ICON_SRC" -resize "${sz}x${sz}^" -gravity center -extent "${sz}x${sz}" "$dir/ic_launcher.png"
              cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
              convert "$ICON_SRC" -resize "${art}x${art}^" -gravity center -extent "${art}x${art}" -background "#1C1917" -gravity center -extent "${fg}x${fg}" "$dir/ic_launcher_foreground.png"
            }
            set_icon mipmap-mdpi 48 108
            set_icon mipmap-hdpi 72 162
            set_icon mipmap-xhdpi 96 216
            set_icon mipmap-xxhdpi 144 324
            set_icon mipmap-xxxhdpi 192 432
            if [ -f "$RES_DIR/values/ic_launcher_background.xml" ]; then
              sed -i 's/#[0-9A-Fa-f]\{6,8\}/#1C1917/g' "$RES_DIR/values/ic_launcher_background.xml"
            fi
          fi

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Kerajaan 1066 APK
        uses: actions/upload-artifact@v4
        with:
          name: kerajaan-1066-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
